# =========================================================
# EC2 한 대에 전부 올린다.
#
# 사용자 200~300명 규모라 쪼갤 이유가 없다.
#
# 두 가지 방식으로 띄울 수 있다.
#
#   운영   docker compose --profile https up -d
#          Caddy가 앞에 서서 HTTPS를 처리한다. 앱은 loopback에만
#          열려 있어 밖에서 직접 닿을 수 없다.
#
#   테스트 docker compose up -d          (APP_BIND=0.0.0.0:80)
#          Caddy 없이 앱이 80번을 직접 받는다. 도메인과 인증서가
#          없어도 되지만 HTTP다 — 웹 푸시(H-01)와 홈 화면 추가(H-04)는
#          동작하지 않는다.
#
# 어느 쪽이든 DB는 밖으로 열지 않는다.
# =========================================================

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # --profile https 를 줄 때만 뜬다.
    profiles: ['https']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서가 여기 저장된다. 이 볼륨이 없으면 컨테이너를
      # 다시 띄울 때마다 인증서를 새로 받으러 가고, Let's Encrypt의
      # 주당 발급 한도(도메인당 5회)에 걸려 일주일간 HTTPS가 막힌다.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
    # 기본값은 loopback이다. Caddy를 통해서만 닿고 밖에서는 보이지 않는다.
    # 테스트로 직접 열려면 .env 에 APP_BIND=0.0.0.0:80 을 넣는다.
    ports:
      - '${APP_BIND:-127.0.0.1:3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 앱을 띄우기 전에 한 번 돌고 끝난다.
  # 코드는 새 컬럼을 찾는데 DB에 없는 상태로 뜨는 것을 막는다.
  migrate:
    build:
      context: .
      target: migrator
    restart: 'no'
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env 에 넣어주세요}
      POSTGRES_DB: ${POSTGRES_DB:-connect}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 백업 스크립트가 여기로 덤프를 떨어뜨린다.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-connect} -d ${POSTGRES_DB:-connect}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
